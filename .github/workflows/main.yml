name: Render Auto Switcher

on:
  # Har 15 minute me automatic check
  schedule:
    - cron: '*/15 * * * *'

  # Manual run button (Actions tab se)
  workflow_dispatch:

jobs:
  switch:
    name: Check Account 1 → Switch to Account 2 if needed
    runs-on: ubuntu-latest

    steps:
      # 1. Code download
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Python setup
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 3. Dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      # 4. Switcher run
      - name: Run Auto-Switcher
        env:
          # Account 1
          RENDER_API_KEY_1: ${{ secrets.RENDER_API_KEY_1 }}
          SERVICE_ID_1: ${{ secrets.SERVICE_ID_1 }}
          SERVICE_URL_1: ${{ secrets.SERVICE_URL_1 }}

          # Account 2
          RENDER_API_KEY_2: ${{ secrets.RENDER_API_KEY_2 }}
          SERVICE_ID_2: ${{ secrets.SERVICE_ID_2 }}
          SERVICE_URL_2: ${{ secrets.SERVICE_URL_2 }}

          # Optional Telegram alerts
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

          # Account 1 healthy ho to Account 2 auto-suspend
          SUSPEND_IDLE_ACCOUNT: 'true'
        run: python switcher.py
