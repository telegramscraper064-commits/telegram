name: Render Auto-Switcher

on:
  schedule:
    - cron: '*/10 * * * *'  # Har 10 minute mein run hoga
  workflow_dispatch:        # Manual run karne ka option

jobs:
  run-switcher:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Install Dependencies
        run: pip install requests
        
      - name: Run Switch Script
        env:
          RENDER_API_KEY_1: ${{ secrets.RENDER_API_KEY_1 }}
          SERVICE_ID_1: ${{ secrets.SERVICE_ID_1 }}
          SERVICE_URL_1: ${{ secrets.SERVICE_URL_1 }}
          RENDER_API_KEY_2: ${{ secrets.RENDER_API_KEY_2 }}
          SERVICE_ID_2: ${{ secrets.SERVICE_ID_2 }}
          SERVICE_URL_2: ${{ secrets.SERVICE_URL_2 }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python switch.py
